# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-maven
---
name: Java CI with Maven

on:
  push:
    branches:
      - main
      - "renovate/**"
    tags:
      - "**"
  pull_request:
  merge_group:

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        profile:
          - {druid: druid-30.0.1, java: '17'}
          - {druid: druid-35.0.1, java: '21'}
          - {druid: druid-37.0.0, java: '21'}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          java-version: ${{ matrix.profile.java }}
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: |
          ./mvnw \
            --batch-mode \
            --no-transfer-progress \
            --file pom.xml \
            -P${{ matrix.profile.druid }} \
            clean verify

      - name: Update dependency graph
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: advanced-security/maven-dependency-submission-action@aeab9f885293af501bae8bdfe88c589528ea5e25 # v4.1.2
        with:
          maven-args: '-P${{matrix.profile.druid}}'
